<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucher</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/interaktion.css">

    <style>
        :root {
            --ink: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --font-text: 'Inclusive Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            /* Breite eines abgelegten Stationsbildes */
            --piece: min(300px, 22vw);

            /* Das eingescannte Papier als Fläche — ein halbdeckender weißer
               Wasch nimmt ihm etwas Stärke, kein zusätzliches Korn obenauf. */
            --paper-bg:
                linear-gradient(rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0.38)),
                url('/img/interactionen/textur.jpg') center center / cover no-repeat;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            /* Auch hier, falls html/body durch Rundung mal nicht exakt
               deckungsgleich sind — sonst blitzt dort ein weißer Rand auf. */
            background: var(--paper-bg);
        }

        body {
            /* Ein weißes Blatt Papier: hier wird collagiert. */
            color: var(--ink);
            font-family: var(--font-text);
            overflow: hidden;
            cursor: none;
        }

        /* QR-Karte, zentriert; verschwindet, sobald der Sucher am Handy läuft. */
        .connect {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: var(--paper-bg);
            transition: opacity 0.6s ease;
        }

        .connect.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Direkt beim Parsen gesetzt (Script unten), bevor überhaupt etwas
           gemalt ist — ohne Übergang, damit der Code beim Reload einer schon
           verbundenen Sitzung nicht kurz aufblitzt. */
        .connect[hidden] {
            display: none;
        }

        /* Eigens positioniert statt im zentrierten Flex-Block: so sitzt er
           deutlich höher als QR-Karte und Text, unabhängig von deren Mitte.
           top in vh, damit er auf jeder Bildschirmhöhe im selben Abstand zum
           Rand bleibt statt an der QR-Karte kleben zu bleiben. */
        .connect-title {
            position: absolute;
            top: clamp(24px, 10vh, 120px);
            left: 50%;
            transform: translateX(-50%);
            width: min(90%, 40em);
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 600;
            text-align: center;
            line-height: 1.3;
        }

        .qr {
            width: 240px;
            height: 240px;
            border-radius: 16px;
            padding: 12px;
            background: #fff;
        }

        .qr img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .connect p {
            font-size: 0.95rem;
            color: var(--ink);
            text-transform: lowercase;
        }

        /* ── Die Collage ───────────────────────────────────────────────────
           Abgelegte Stationsbilder, frei auf dem Blatt verteilt. */
        .sheet {
            position: fixed;
            inset: 0;
        }

        .sheet[hidden] {
            display: none;
        }

        .piece {
            --selection-progress: 0;
            position: absolute;
            width: var(--piece);
            transform: translate(-50%, -50%) scale(1);
            /* Noch nicht betreten: das Bild liegt erst als Entwurf auf dem
               Blatt. Nach der Station steht es in voller Farbe. */
            opacity: 0.45;
            transition: opacity 0.6s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .piece.is-dropping {
            transform: translate(-50%, -50%) scale(1.35);
            opacity: 0;
        }

        .piece.done,
        .piece.revealed {
            opacity: 1;
        }

        /* Ein Bild besteht aus zwei Lagen: dem Foto und – falls vorhanden – der
           Umrissskizze darüber. Das Foto bildet die Höhe (im Fluss), die Skizze
           liegt deckungsgleich darauf. */
        .piece img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Auswahl-Blend beim Halten: das Foto löst sich in die Zeichnung auf,
           gesteuert über --selection-progress (setzt sucher.js) — dieselbe
           Handschrift wie die Szenenwahl in eintragspfade-2. Kein transition auf
           der Deckkraft: Die Weichheit kommt aus dem Haltefortschritt selbst,
           ein zusätzlicher Übergang würde nur doppelt glätten und schmieren. */
        .piece-base {
            opacity: calc(1 - var(--selection-progress));
        }

        .piece-stroke {
            position: absolute;
            top: 0;
            left: 0;
            opacity: var(--selection-progress);
        }

        /* Das getragene Bild. Es wandert mit dem Zeiger vom Handy herüber und
           hängt hier an ihm, bis es abgelegt wird. Der trägere Übergang als
           beim Cursor gibt ihm Gewicht — es zieht spürbar nach. */
        .carried {
            position: fixed;
            width: var(--piece);
            height: auto;
            margin: 0;
            pointer-events: none;
            z-index: 11;
            opacity: 0.85;
            transform: translate(-50%, -50%) scale(1);
            transition: left 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                top 0.18s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .carried[hidden] {
            display: none;
        }

        /* Beim Herüberwechseln kurz größer und blasser: es kommt an. */
        .carried.is-arriving {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.3);
        }

        /* Sucher-Cursor: die Hand aus dem Einstieg, wie auf dem Handy. */
        .cursor {
            position: fixed;
            width: 80px;
            height: 80px;
            margin: -40px 0 0 -40px;
            pointer-events: none;
            z-index: 12;
            opacity: 0;
            transition: left 0.16s ease-out, top 0.16s ease-out, opacity 0.2s ease;
        }

        .cursor.is-on {
            opacity: 1;
        }

        .cursor-hand {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 56px;
            height: auto;
            transform: translate(-50%, -50%);
        }

        /* Der Kringel (kringel2.png), dieselbe Handschrift wie in den übrigen
           Stationen: eine SVG-Maske legt das Bild beim Halten schrittweise
           frei (stroke-dashoffset, gesetzt von sucher.js). viewBox = PNG-Größe. */
        .cursor-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 130px;
            height: auto;
            transform: translate(-50%, -50%);
        }

        /* Die wenigen Hinweise, die das Blatt trägt. */
        .hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 40px;
            text-align: center;
            font-size: 1.05rem;
            font-weight: 400;
            color: var(--accent);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 13;
        }

        .hint.is-on {
            opacity: 1;
        }

        /* Rahmen der laufenden Station: deckt das Blatt komplett ab. */
        .station {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            /* Eigener Hintergrund fürs Einblenden, bevor das Dokument der
               Station selbst gemalt hat — sonst blitzt dort kurz ein weißer
               Rand auf, wo die Station noch nicht geladen ist. */
            background: var(--paper-bg);
            opacity: 0;
            /* Dauer fürs Einblenden; beim Verlassen setzt sucher.js eine
               eigene, langsamere Transition inline (STATION_FADE_MS). */
            transition: opacity 0.4s ease;
            z-index: 15;
        }

        .station[hidden] {
            display: none;
        }

        /* Reset-Button oben rechts: klein, unauffällig, nur per Handhaltung
           (Sucher-Cursor) ansteuerbar — kein Maus-/Touch-Ziel. Der Fortschritt
           füllt sich von links nach rechts, bewusst langsam. */
        .reset-btn {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 14;
            padding: 7px 14px;
            font-family: var(--font-text);
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: var(--ink);
            background: #ffffff;
            border: 1px solid var(--ink);
            border-radius: 999px;
            overflow: hidden;
            opacity: 0.5;
            transition: opacity 0.25s ease;
        }

        .reset-btn[hidden] {
            display: none;
        }

        .reset-btn.is-active {
            opacity: 1;
        }

        .reset-btn-fill {
            position: absolute;
            inset: 0;
            width: 0%;
            background: rgba(15, 23, 42, 0.18);
        }

        .reset-btn-label {
            position: relative;
            z-index: 1;
            text-transform: lowercase;
            white-space: nowrap;
        }

    </style>
</head>

<body>
    <div class="sheet" id="sheet" hidden></div>

    <button class="reset-btn" id="resetBtn" type="button" tabindex="-1" aria-hidden="true" hidden>
        <span class="reset-btn-fill" id="resetBtnFill"></span>
        <span class="reset-btn-label">alles zurücksetzen</span>
    </button>

    <img class="carried" id="carried" alt="" hidden>

    <p class="hint" id="hint"></p>

    <!-- Hand-Cursor: offen (drop) im freien Zustand, geschlossen (drag) sobald ein
         Keyvisual getragen wird. sucher.js tauscht die Quelle. -->
    <div class="cursor" id="cursor" aria-hidden="true">
        <img class="cursor-hand" id="cursorHand" src="/img/interactionen/einstieg/cursor_drop.png" alt="">
        <!-- Halte-Fortschritt: der Kringel zeichnet sich fort, sobald ruhig
             gehalten wird. stroke-dashoffset setzt sucher.js. -->
        <svg class="cursor-ring" viewBox="0 0 499 307" aria-hidden="true">
            <defs>
                <mask id="cursorKringelMask">
                    <path id="cursorKringelPath"
                        d="M331.5 70.5L330 65C330 65 287.5 50 258.5 51.5C229.5 53 161.511 63.7435 110.5 96C76.3959 117.566 49.0001 132 34.5002 166C20.0004 200 30.0002 214 30.0002 214C30.0002 214 48 268.5 141 284.5C234 300.5 269.5 289 269.5 289C269.5 289 378.718 274.937 422 227.5C445.036 202.254 466.774 185.1 464.5 151C462 113.5 446.5 97.5 417 68C387.5 38.5 321.5 31 321.5 31L239.5 24H181"
                        stroke="#fff" fill="none" stroke-width="26" stroke-linecap="round"
                        stroke-linejoin="round" />
                </mask>
            </defs>
            <image href="/img/interactionen/transportmechanismen/kringel2.png" width="499" height="307"
                mask="url(#cursorKringelMask)" />
        </svg>
    </div>

    <iframe class="station" id="station" hidden title="Station"></iframe>

    <div class="connect" id="connect">
        <h1 class="connect-title">Hybrider Lernraum:<br>Mikroplastik in Böden</h1>
        <div class="qr"><img id="qrImage" src="" alt="QR-Code"></div>
        <p>Scanne den Code, um den Sucher auf dem Handy zu öffnen</p>
    </div>
    <script>
        // War beim letzten Mal schon ein Handy verbunden, den QR-Code gar nicht
        // erst malen — sonst blitzt er beim Reload kurz auf, bis sucher.js den
        // echten Status vom Server hat. sucher.js hebt dies bei Bedarf wieder auf.
        try {
            if (localStorage.getItem('sucherConnected') === '1') {
                document.getElementById('connect').hidden = true;
            }
        } catch (e) { /* Privatmodus */ }
    </script>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/sucher.js"></script>
</body>

</html>
